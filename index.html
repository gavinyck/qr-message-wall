<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言牆</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wall-layout">
    <div class="qr-panel">
      <div id="qrcode"></div>
      <p id="qr-url"></p>
    </div>
    <div class="messages-panel" id="messages">
      <p class="empty-hint">掃描左邊 QR Code，你的話會出現在這裡</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const room = params.get("room") || "main";

    // 網址越短，QR Code 的格子越少、越好掃，所以預設房間就不帶參數
    const inputUrl = new URL("input.html", location.href);
    if (room !== "main") {
      inputUrl.searchParams.set("room", room);
    }

    // margin 預設為 4 格，白色留白會直接畫進 SVG 裡，不依賴 CSS
    const qr = qrcode(0, "M");
    qr.addData(inputUrl.toString());
    qr.make();
    document.getElementById("qrcode").innerHTML =
      qr.createSvgTag({ cellSize: 8, scalable: true });

    document.getElementById("qr-url").textContent = inputUrl.toString();

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const messagesRef = db.ref("messages/" + room).limitToLast(100);

    const container = document.getElementById("messages");
    let hasMessages = false;

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    messagesRef.on("child_added", (snapshot) => {
      const data = snapshot.val();
      if (!data || !data.text) return;

      if (!hasMessages) {
        container.innerHTML = "";
        hasMessages = true;
      }

      const card = document.createElement("div");
      card.className = "message-card";
      card.innerHTML = escapeHtml(data.text);
      container.prepend(card);
    });
  </script>
</body>
</html>
