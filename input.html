<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>說一句話</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>💬</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="input-layout">
    <h1>留下你的一句話</h1>
    <textarea id="text" maxlength="100" placeholder="輸入你想說的話..."></textarea>
    <div class="char-count"><span id="count">0</span>/100</div>
    <button id="submit">送出</button>
    <div class="status-msg" id="status"></div>
  </div>

  <!-- 這頁刻意不載入 Firebase SDK：SDK 會為了即時同步開一條 websocket
       並持續佔用，而免費方案只有 100 個同時連線。活動現場七、八十支手機
       就會逼近上限，後面的人會送不出留言。送出是一次性動作，改用 REST
       就完全不佔連線，手機也少下載約 55 KB。 -->
  <script src="firebase-config.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const room = params.get("room") || "main";
    const COOLDOWN_MS = 5000;
    const MAX_LENGTH = 100;
    const storageKey = "lastSubmit_" + room;

    const endpoint = firebaseConfig.databaseURL.replace(/\/$/, "") +
      "/messages/" + encodeURIComponent(room) + ".json";

    const textEl = document.getElementById("text");
    const countEl = document.getElementById("count");
    const submitBtn = document.getElementById("submit");
    const statusEl = document.getElementById("status");

    textEl.addEventListener("input", () => {
      countEl.textContent = textEl.value.length;
    });

    submitBtn.addEventListener("click", async () => {
      const text = textEl.value.trim();
      if (!text) {
        statusEl.textContent = "請先輸入文字";
        return;
      }

      const lastSubmit = Number(localStorage.getItem(storageKey) || 0);
      const now = Date.now();
      if (now - lastSubmit < COOLDOWN_MS) {
        statusEl.textContent = "傳送太頻繁，請稍候再試";
        return;
      }

      if (text.length > MAX_LENGTH) {
        statusEl.textContent = "最多只能輸入 " + MAX_LENGTH + " 個字";
        return;
      }

      submitBtn.disabled = true;
      statusEl.textContent = "傳送中...";

      try {
        // POST 等同於 SDK 的 push()，會自動產生一個新的 key
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          // .sv 讓伺服器自己填時間，手機時鐘不準也不影響排序
          body: JSON.stringify({ text, createdAt: { ".sv": "timestamp" } })
        });

        if (!res.ok) throw new Error("HTTP " + res.status);

        localStorage.setItem(storageKey, String(now));
        textEl.value = "";
        countEl.textContent = "0";
        statusEl.textContent = "已送出！";
      } catch (err) {
        statusEl.textContent = "傳送失敗，請再試一次";
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
